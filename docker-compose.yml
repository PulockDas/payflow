services:
  db:
    image: postgres:16
    container_name: payflow-db
    environment:
      # Values come from .env (Compose reads it automatically).
      # The :? makes Compose fail with a clear error if a variable is missing.
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER is not set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
    ports:
      - "5432:5432"   # host:container, so the Spring app on Windows can reach it at localhost:5432
    volumes:
      - payflow-db-data:/var/lib/postgresql/data   # keeps data when the container is removed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The PayFlow app itself, built from our Dockerfile.
  # Behind the "full" profile, so plain `docker compose up` (and the VS Code task)
  # still starts ONLY the db. Start both with: docker compose --profile full up -d --build
  app:
    profiles: ["full"]
    build: .
    container_name: payflow-app
    env_file: .env          # secrets passed at runtime, never baked into the image
    environment:
      DB_HOST: db           # service name on the Compose network (inside a container, localhost = itself)
    ports:
      - "8080:8080"         # so the browser and `stripe listen` on Windows reach it at localhost:8080
    depends_on:
      db:
        condition: service_healthy   # wait for the pg_isready healthcheck above

volumes:
  payflow-db-data:
