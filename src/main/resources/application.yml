spring:
  application:
    name: payflow

  # Load .env from the working directory if it exists (local dev only).
  # Real OS environment variables always take priority over it.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Create/alter tables to match the @Entity classes on startup (fine for dev;
      # real projects use migration tools like Flyway instead).
      ddl-auto: update

# Our own settings (not Spring's). Read later with @Value or @ConfigurationProperties.
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

# Public URL of this app; Stripe redirects customers back here after checkout.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Shared secret for admin endpoints (refunds), sent as the X-Admin-Token header. No default.
  admin-token: ${ADMIN_API_TOKEN}
